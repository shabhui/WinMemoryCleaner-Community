name: Community CI

# Non-publishing CI for the community continuation: build both configurations and
# run the safe NUnit suite. No signing, no release, no package-manager submission.

on:
  push:
    branches: [community, main]
    paths: ['src/**', 'build-community.ps1']
  pull_request:
    branches: [community, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and safe tests
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: src/packages
          key: community-nuget-${{ hashFiles('src/packages.config') }}
          restore-keys: community-nuget-

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $nuget = Join-Path $env:RUNNER_TEMP 'nuget.exe'
          Invoke-WebRequest -Uri 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' -OutFile $nuget
          & $nuget restore (Join-Path 'src' 'packages.config') -PackagesDirectory (Join-Path 'src' 'packages') -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Report toolchain
        shell: pwsh
        run: |
          msbuild -version
          $pack = 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.0\mscorlib.dll'
          $pkg = 'src\packages\Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3\build\.NETFramework\v4.0\mscorlib.dll'
          Write-Host "installed 4.0 targeting pack: $(Test-Path $pack)"
          Write-Host "restored net40 reference assemblies: $(Test-Path $pkg)"
          if (-not (Test-Path $pkg)) { throw "net40 reference assemblies package is missing after restore" }

      - name: Build (production, test-isolated) and run safe tests
        shell: pwsh
        run: |
          # Visual Studio MSBuild (tools version != 4.0) imports the restored
          # Microsoft.NETFramework.ReferenceAssemblies.net40 targets, so the
          # runner does not need a locally installed .NET Framework 4.0 pack.
          $msbuild = (Get-Command msbuild).Source
          Write-Host "MSBuild: $msbuild"
          & .\build-community.ps1 -Tests -MSBuildPath $msbuild

      - name: Collect test results
        if: always()
        shell: pwsh
        run: |
          # The script writes the NUnit report under $env:TEMP (8.3 short path on
          # runners), so copy the newest report to a stable workspace path first.
          $report = Get-ChildItem (Join-Path $env:TEMP 'wmc-community-tests-*\TestResults.xml') -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($report) {
            New-Item -ItemType Directory -Path TestResults -Force | Out-Null
            Copy-Item $report.FullName (Join-Path 'TestResults' 'TestResults.xml') -Force
            Write-Host "Collected $($report.FullName)"
          } else {
            Write-Host 'No NUnit report found'
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults/TestResults.xml
          if-no-files-found: warn
          retention-days: 14
