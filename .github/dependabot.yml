version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
    target-branch: "community"
    labels:
      - "dependencies"
      - "nuget"
    ignore:
      # The test stack is pinned to the legacy NUnit 2.6.4 runner used by
      # build-community.ps1 (nunit-console.exe). Moving to NUnit 3.x would
      # require rewriting the suite and a different runner, so skip updates.
      - dependency-name: "NUnit*"
