name: Community CI

# Non-publishing CI: complete Roslyn analysis, both isolated safe NUnit suites and
# same-build embedded payload verification. No driver installation or publication.

on:
  push:
    branches: [community, main]
    paths: ['src/**', 'sensors/**', 'shared/**', 'tools/**', 'build-community.ps1', '.github/workflows/community-*.yml']
  pull_request:
    branches: [community, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and safe tests
    runs-on: windows-latest
    # The safe suite normally finishes in well under two minutes; without this
    # bound a hung runner would block later pushes for the 6h default.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: src/packages
          key: community-nuget-${{ hashFiles('src/packages.config') }}
          restore-keys: community-nuget-

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $nuget = Join-Path $env:RUNNER_TEMP 'nuget.exe'
          Invoke-WebRequest -Uri 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' -OutFile $nuget
          & $nuget restore (Join-Path 'src' 'packages.config') -PackagesDirectory (Join-Path 'src' 'packages') -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Report toolchain
        shell: pwsh
        run: |
          msbuild -version
          $pack = 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.0\mscorlib.dll'
          $pkg = 'src\packages\Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3\build\.NETFramework\v4.0\mscorlib.dll'
          Write-Host "installed 4.0 targeting pack: $(Test-Path $pack)"
          Write-Host "restored net40 reference assemblies: $(Test-Path $pkg)"
          if (-not (Test-Path $pkg)) { throw "net40 reference assemblies package is missing after restore" }

      - name: Build (production, test-isolated) and run safe tests
        shell: pwsh
        run: |
          # Visual Studio MSBuild (tools version != 4.0) imports the restored
          # Microsoft.NETFramework.ReferenceAssemblies.net40 targets, so the
          # runner does not need a locally installed .NET Framework 4.0 pack.
          $msbuild = (Get-Command msbuild).Source
          Write-Host "MSBuild: $msbuild"
          & .\build-community.ps1 -Tests -MSBuildPath $msbuild

      - name: Upload both test suites and payload verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            build/test-results/TestResults.xml
            build/test-results/SensorTestResults.xml
            build/test-results/*payload.json
            build/test-results/source-bundle.json
            build/test-results/SourceBundleTests.json
          if-no-files-found: warn
          retention-days: 14
